[package]
name = "api"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
axum = "0.8.8"
http = "1.4.0"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = "0.3.23"
kyber_crypto = { workspace = true }
contracts = { workspace = true }
async-trait = "0.1.89"
uuid = { version = "1.23.0", features = ["v4"] }
redis = { version = "1.1.0", features = ["tokio-comp"] }
serde = { version = "1.0.228", features = ["derive"] }
dotenv = "0.15.0"
thiserror = "2.0.18"
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "uuid", "postgres"] }
argon2 = "0.5.3"
kyber_tui = { version = "0.1.0", path = "../tui" }
