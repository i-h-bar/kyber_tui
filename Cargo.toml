[workspace]
members =[
    "crates/api",
    "crates/contracts",
    "crates/pqcrypto",
    "crates/tui",
]
resolver = "2"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"

[workspace.dependencies]
pqcrypto = { path= "crates/pqcrypto" }
contracts = { path="crates/contracts" }
